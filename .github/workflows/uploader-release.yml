# Builds the Booth Uploader Mac app and publishes it as a GitHub Release.
# Trigger: push a tag like uploader-v1.0.1 (or run it by hand from the Actions tab).
name: Booth Uploader release
on:
  push:
    tags: ["uploader-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: uploader } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: uploader/package-lock.json }
      - run: npm ci
      - run: npx electron-builder --mac --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'uploader-latest' }}
          name: Booth Uploader ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            Menu-bar app for the editing Mac. **Booth-Uploader-arm64.zip** for Apple Silicon (M1 and later), **Booth-Uploader-x64.zip** for Intel Macs.
            Unsigned build: on first launch macOS will block it. Click Done, then System Settings → Privacy & Security → **Open Anyway**.
          files: |
            uploader/dist/Booth-Uploader-arm64.zip
            uploader/dist/Booth-Uploader-x64.zip
